# Local Postgres for development and tests. `skali dev` is the alternative
# that runs the whole manifest.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gb
      POSTGRES_PASSWORD: local-password
      POSTGRES_DB: gb
    ports: ["127.0.0.1:55441:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gb"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes: [postgres:/var/lib/postgresql/data]
volumes:
  postgres:
