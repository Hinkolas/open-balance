# yaml-language-server: $schema=https://raw.githubusercontent.com/Hinkolas/skali/main/schemas/skali.schema.json
#
# One headless Go service plus Postgres. The server stores encrypted blobs
# only (docs/PROTOCOL.md). ${NAME} values come from .env under `skali dev`
# and from .env.<environment> (e.g. .env.staging) staged by `skali deploy`.
name: group-balance
description: End-to-end encrypted group ledger server
applications:
  server:
    build:
      context: .
    environment:
      DATABASE_URL: "{{databases.data.url}}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      SERVER_NAME: "${SERVER_NAME:-Group Balance}"
      PORT: "8080"
    ports:
      http:
        port: 8080
    routes:
      public:
        domain: "${SERVER_DOMAIN}"
        port: http
        tls: automatic
    health:
      startup:
        http: {port: http, path: /healthz}
      readiness:
        http: {port: http, path: /readyz}
      liveness:
        http: {port: http, path: /healthz}
    scaling:
      replicas: {min: 2}
    placement:
      spread:
        across: nodes
        minimum: 2
        enforcement: preferred
    resources:
      requests: {cpu: 0.1, memory: 64MB}
      limits: {cpu: 1, memory: 256MB}
    deployment:
      releaseCommand:
        command: [/server, migrate]
        timeout: 5m
    shutdown:
      gracePeriod: 30s
    commands:
      migrate: [go, run, ./cmd/server, migrate]
      # Go tests against the dev database (they only add rows).
      test: [sh, -c, 'TEST_DATABASE_URL="$DATABASE_URL" go test ./...']
    dev:
      # Migrate first, like the release command does on a deploy.
      command: [sh, -c, 'go build -o bin/server ./cmd/server && bin/server migrate && exec bin/server serve']
databases:
  data:
    engine: postgres
    version: 17
    storage: {size: 5GB}
    recovery:
      pointInTime: 7d
